name: Cleanup Completed Workflows

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete completed workflows
        env:
          TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PER_PAGE=100
          PAGE=1

          while :; do
            echo "Fetching runs page $PAGE..."
            RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=$PER_PAGE&page=$PAGE&status=completed")

            RUN_IDS=$(echo "$RESPONSE" | jq -r '.workflow_runs[].id')

            if [[ -z "$RUN_IDS" ]]; then
              echo "No more runs to delete."
              break
            fi

            for RUN_ID in $RUN_IDS; do
              echo "Deleting run ID $RUN_ID"
              curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID"
            done

            ((PAGE++))
          done
